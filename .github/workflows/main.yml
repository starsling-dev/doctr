name: tests

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  pytest-common:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Cache python modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pkg-deps-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}-tests
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[viz,html] --upgrade
          pip install -e .[testing]
      - name: Run unittests
        run: |
          coverage run -m pytest tests/common/ -rs
          coverage xml -o coverage-common.xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-common
          path: ./coverage-common.xml
          if-no-files-found: error


  # tests/pytorch/ is split into duration-balanced shards that run in parallel.
  # Balancing is by pytest-split using the committed .test_durations timings, not
  # by test count: one test (test_torch_compiled_models[tablecenternet]) runs ~405s
  # -- ~20% of the suite -- so a count-based split clusters the slow torch.compile
  # tests and leaves one shard far longer than the rest. 6 shards is deliberate:
  # that single ~405s test is the hard wall-clock floor no split can beat, so more
  # than ~6 shards spends extra runner-minutes for no additional wall-clock gain.
  pytest-torch-shard:
    name: pytest-torch shard ${{ matrix.group }} of ${{ matrix.splits }} (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11"]
        # `group` must be 1..splits; keep the two in sync when changing shard count.
        group: [1, 2, 3, 4, 5, 6]
        splits: [6]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Cache python modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pkg-deps-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}-tests
      - name: Ensure C++ compiler for torch.compile
        # tests/pytorch/ exercises torch.compile, whose inductor backend shells out to
        # a C++ compiler (cc1plus) at test time. ubuntu-latest already ships g++, so
        # this is a fast presence check and only falls back to apt-get when g++ is
        # actually missing -- avoiding an unconditional apt-get update on the hot path.
        run: |
          if command -v g++ >/dev/null && test -x "$(g++ -print-prog-name=cc1plus)"; then
            g++ --version
          else
            sudo apt-get update
            sudo apt-get install -y g++
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[viz,html] --upgrade
          pip install -e .[testing]
      - name: Run unittests (shard ${{ matrix.group }}/${{ matrix.splits }})
        # pytest-split partitions tests/pytorch/ into `splits` duration-balanced groups
        # from the committed .test_durations file and runs one group here. Partitioning
        # is deterministic and each test lands in exactly one group, so the union across
        # shards is the full suite regardless of collection order. A test absent from
        # .test_durations (e.g. newly added) is assigned the average duration -- still
        # run exactly once, only slightly less balanced -- and a missing durations file
        # degrades to an even split, never to dropped or duplicated tests.
        run: |
          coverage run --parallel-mode -m pytest tests/pytorch/ -rs \
            --splits ${{ matrix.splits }} --group ${{ matrix.group }} \
            --durations-path .test_durations
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-pytorch-shard-${{ matrix.group }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error

  pytest-torch:
    # IMPORTANT: this job's `name` is the required status check tracked by branch
    # protection. It must stay exactly "pytest-torch (ubuntu-latest, 3.11)" -- the
    # aggregate is what gates the merge, and the shards feed it via `needs`. If a
    # Python version is re-added later, update this name and the shard matrix in
    # lockstep, or branch protection will silently stop gating.
    name: pytest-torch (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    needs: pytest-torch-shard
    if: always()
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install coverage
        if: ${{ needs.pytest-torch-shard.result == 'success' }}
        run: python -m pip install "coverage[toml]>=4.5.4"

      - name: Download shard coverage
        if: ${{ needs.pytest-torch-shard.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-pytorch-shard-*
          path: shard-coverage
          merge-multiple: true

      - name: Combine coverage
        # This job does a fresh checkout and does not run setup.py, so the generated
        # (untracked) doctr/version.py is absent here; omit it so `coverage xml` does
        # not error on its missing source. Every other measured source file exists in
        # the checkout at the same path the shards recorded.
        if: ${{ needs.pytest-torch-shard.result == 'success' }}
        run: |
          coverage combine shard-coverage
          coverage xml --omit="*/doctr/version.py" -o coverage-pt.xml

      - name: Fail if a shard failed
        if: ${{ needs.pytest-torch-shard.result != 'success' }}
        run: exit 1

      - uses: actions/upload-artifact@v7
        if: ${{ needs.pytest-torch-shard.result == 'success' }}
        with:
          name: coverage-pytorch
          path: ./coverage-pt.xml
          if-no-files-found: error

  codecov-upload:
    runs-on: ubuntu-latest
    needs: [ pytest-common, pytest-torch ]
    steps:
      - uses: actions/checkout@v7
      - name: Download common coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-common
          path: coverage-reports
      - name: Download pytorch coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-pytorch
          path: coverage-reports
      - name: Upload coverage to Codecov
        # Only the two final XML reports are uploaded; disable_search stops Codecov
        # from discovering the raw per-shard .coverage* databases.
        uses: codecov/codecov-action@v7
        with:
          files: coverage-reports/coverage-common.xml,coverage-reports/coverage-pt.xml
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
