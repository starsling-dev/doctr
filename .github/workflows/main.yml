name: tests

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  pytest-common:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Cache python modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pkg-deps-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}-tests
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[viz,html] --upgrade
          pip install -e .[testing]
      - name: Run unittests
        run: |
          coverage run -m pytest tests/common/ -rs
          coverage xml -o coverage-common.xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-common
          path: ./coverage-common.xml
          if-no-files-found: error


  pytest-torch-shard:
    name: pytest-torch shard ${{ matrix.shard }} of ${{ matrix.shard_total }} (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11"]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        shard_total: [8]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Cache python modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pkg-deps-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}-tests
      - name: Ensure C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[viz,html] --upgrade
          pip install -e .[testing]

      - name: Select shard tests
        shell: bash
        run: |
          pytest tests/pytorch/ --collect-only -q > collected-tests.txt
          python - "${{ matrix.shard }}" "${{ matrix.shard_total }}" <<'PY'
          import sys

          shard = int(sys.argv[1])
          total = int(sys.argv[2])
          with open("collected-tests.txt", encoding="utf-8") as handle:
              nodeids = [
                  line.strip()
                  for line in handle
                  if line.startswith("tests/pytorch/") and "::" in line
              ]

          selected = [
              nodeid
              for index, nodeid in enumerate(nodeids)
              if index % total == shard - 1
          ]
          with open("selected-tests.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(selected))
              handle.write("\n")
          print(f"collected={len(nodeids)} selected={len(selected)} shard={shard}/{total}")
          if not selected:
              raise SystemExit("empty shard")
          PY

      - name: Run unittests
        shell: bash
        run: |
          mapfile -t selected_tests < selected-tests.txt
          coverage run --parallel-mode -m pytest "${selected_tests[@]}" -rs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-pytorch-shard-${{ matrix.shard }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error

  pytest-torch:
    name: pytest-torch (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    needs: pytest-torch-shard
    if: always()
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install coverage
        if: ${{ needs.pytest-torch-shard.result == 'success' }}
        run: python -m pip install "coverage[toml]>=4.5.4"

      - name: Download shard coverage
        if: ${{ needs.pytest-torch-shard.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-pytorch-shard-*
          path: shard-coverage
          merge-multiple: true

      - name: Combine coverage
        if: ${{ needs.pytest-torch-shard.result == 'success' }}
        run: |
          coverage combine shard-coverage
          coverage xml --omit="*/doctr/version.py" -o coverage-pt.xml

      - name: Fail if a shard failed
        if: ${{ needs.pytest-torch-shard.result != 'success' }}
        run: exit 1

      - uses: actions/upload-artifact@v7
        if: ${{ needs.pytest-torch-shard.result == 'success' }}
        with:
          name: coverage-pytorch
          path: ./coverage-pt.xml
          if-no-files-found: error

  codecov-upload:
    runs-on: ubuntu-latest
    needs: [ pytest-common, pytest-torch ]
    steps:
      - uses: actions/checkout@v7
      - name: Download common coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-common
          path: coverage-reports
      - name: Download pytorch coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-pytorch
          path: coverage-reports
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage-reports/coverage-common.xml,coverage-reports/coverage-pt.xml
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
