name: StarSling pytest-torch benchmark

on:
  workflow_dispatch:
    inputs:
      run_baseline:
        description: "Run the full-suite baseline (also stores .test_durations)"
        type: boolean
        default: true
      run_sharded:
        description: "Run the 6-way duration-balanced sharded path"
        type: boolean
        default: true

env:
  PYTHON_VERSION: "3.11"
  SPLITS: "6"

jobs:
  # Full-suite baseline. Doubles as the durations generator: --store-durations
  # writes .test_durations (every test's timing), uploaded so it can be committed
  # to the candidate + benchmark branches to balance the sharded path.
  baseline:
    name: benchmark / baseline
    if: ${{ inputs.run_baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Cache python modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pkg-deps-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}-tests
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[viz,html] --upgrade
          pip install -e .[testing]
          pip install "pytest-split>=0.8.0"
      - name: Run pytest-torch baseline
        shell: bash
        run: |
          set -o pipefail
          started_at="$(date +%s)"
          printf 'variant=baseline\n' | tee benchmark-result.txt
          set +e
          coverage run -m pytest tests/pytorch/ -rs --durations=20 \
            --store-durations --durations-path .test_durations 2>&1 | tee pytest.log
          status="${PIPESTATUS[0]}"
          set -e
          ended_at="$(date +%s)"
          printf 'status=%s\n' "$status" | tee -a benchmark-result.txt
          printf 'duration_s=%s\n' "$((ended_at - started_at))" | tee -a benchmark-result.txt
          coverage xml -o coverage-pt.xml
          line_rate="$(grep -o 'line-rate="[0-9.]*"' coverage-pt.xml | head -1)"
          lines_valid="$(grep -o 'lines-valid="[0-9]*"' coverage-pt.xml | head -1)"
          lines_covered="$(grep -o 'lines-covered="[0-9]*"' coverage-pt.xml | head -1)"
          passed="$(grep -oE '[0-9]+ passed' pytest.log | tail -1)"
          printf 'baseline_%s\n' "$line_rate" | tee -a benchmark-result.txt
          printf 'baseline_%s\n' "$lines_valid" | tee -a benchmark-result.txt
          printf 'baseline_%s\n' "$lines_covered" | tee -a benchmark-result.txt
          printf 'baseline_%s\n' "$passed" | tee -a benchmark-result.txt
          exit "$status"
      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-torch-baseline
          path: |
            benchmark-result.txt
            pytest.log
            coverage-pt.xml
            .test_durations
          include-hidden-files: true
          if-no-files-found: warn

  # 6-way duration-balanced shard, using the committed .test_durations. Matches the
  # candidate main.yml exactly (pytest-split --splits/--group).
  shard:
    name: benchmark / shard ${{ matrix.group }} of 6
    if: ${{ inputs.run_sharded }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Cache python modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pkg-deps-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}-tests
      - name: Ensure C++ compiler for torch.compile
        run: |
          if command -v g++ >/dev/null && test -x "$(g++ -print-prog-name=cc1plus)"; then
            g++ --version
          else
            sudo apt-get update
            sudo apt-get install -y g++
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[viz,html] --upgrade
          pip install -e .[testing]
          pip install "pytest-split>=0.8.0"
      - name: Run pytest-torch shard
        shell: bash
        run: |
          set -o pipefail
          started_at="$(date +%s)"
          printf 'variant=shard-%s-of-%s\n' "${{ matrix.group }}" "${{ env.SPLITS }}" | tee benchmark-result.txt
          if [ -f .test_durations ]; then
            printf 'durations_file=present\n' | tee -a benchmark-result.txt
          else
            printf 'durations_file=MISSING-even-split-fallback\n' | tee -a benchmark-result.txt
          fi
          set +e
          coverage run --parallel-mode -m pytest tests/pytorch/ -rs --durations=20 \
            --splits "${{ env.SPLITS }}" --group "${{ matrix.group }}" \
            --durations-path .test_durations 2>&1 | tee pytest.log
          status="${PIPESTATUS[0]}"
          set -e
          ended_at="$(date +%s)"
          selected="$(grep -oE '[0-9]+ passed' pytest.log | tail -1)"
          skipped="$(grep -oE '[0-9]+ skipped' pytest.log | tail -1)"
          printf 'status=%s\n' "$status" | tee -a benchmark-result.txt
          printf 'duration_s=%s\n' "$((ended_at - started_at))" | tee -a benchmark-result.txt
          printf 'shard_%s\n' "$selected" | tee -a benchmark-result.txt
          printf 'shard_%s\n' "$skipped" | tee -a benchmark-result.txt
          exit "$status"
      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-torch-shard-${{ matrix.group }}
          path: |
            benchmark-result.txt
            pytest.log
            .coverage*
          include-hidden-files: true
          if-no-files-found: warn

  # Mirrors the candidate aggregate: combine shard coverage, omit generated
  # version.py, and report the combined line-rate for the equivalence proof.
  sharded-aggregate:
    name: benchmark / sharded aggregate
    if: ${{ inputs.run_sharded }}
    runs-on: ubuntu-latest
    needs: shard
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install coverage
        run: python -m pip install "coverage[toml]>=4.5.4"
      - name: Download shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pytest-torch-shard-*
          path: shard-artifacts
          merge-multiple: false
      - name: Combine coverage and summarize shards
        shell: bash
        run: |
          set -o pipefail
          find shard-artifacts -name benchmark-result.txt -print -exec cat {} \; | tee shard-results.txt
          awk -F= '
            /variant=/ {variant=$2}
            /status=/ {status[variant]=$2}
            /duration_s=/ {duration[variant]=$2; sum+=$2; if ($2 > max) {max=$2; max_variant=variant}}
            END {
              printf("max_shard_variant=%s\n", max_variant);
              printf("max_shard_duration_s=%s\n", max);
              printf("sum_shard_runner_s=%s\n", sum);
              for (variant in status) { if (status[variant] != 0) failed=1; }
              printf("all_shards_green=%s\n", failed ? "false" : "true");
            }
          ' shard-results.txt | tee aggregate-result.txt
          # sum of passed/skipped across shards -> reconciliation vs baseline count
          sum_passed="$(grep -oE 'shard_[0-9]+ passed' shard-results.txt | grep -oE '[0-9]+' | awk '{s+=$1} END {print s}')"
          sum_skipped="$(grep -oE 'shard_[0-9]+ skipped' shard-results.txt | grep -oE '[0-9]+' | awk '{s+=$1} END {print s}')"
          printf 'sum_shard_passed=%s\n' "$sum_passed" | tee -a aggregate-result.txt
          printf 'sum_shard_skipped=%s\n' "$sum_skipped" | tee -a aggregate-result.txt
          find shard-artifacts -name '.coverage*' -exec cp {} . \;
          coverage combine
          coverage xml --omit="*/doctr/version.py" -o coverage-pt.xml
          test -s coverage-pt.xml
          line_rate="$(grep -o 'line-rate="[0-9.]*"' coverage-pt.xml | head -1)"
          lines_valid="$(grep -o 'lines-valid="[0-9]*"' coverage-pt.xml | head -1)"
          lines_covered="$(grep -o 'lines-covered="[0-9]*"' coverage-pt.xml | head -1)"
          printf 'combined_%s\n' "$line_rate" | tee -a aggregate-result.txt
          printf 'combined_%s\n' "$lines_valid" | tee -a aggregate-result.txt
          printf 'combined_%s\n' "$lines_covered" | tee -a aggregate-result.txt
          # fail the aggregate if any shard failed, matching production semantics
          grep -q 'all_shards_green=true' aggregate-result.txt
      - name: Upload aggregate artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-torch-sharded-aggregate
          path: |
            aggregate-result.txt
            shard-results.txt
            coverage-pt.xml
          if-no-files-found: warn
