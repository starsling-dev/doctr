name: StarSling pytest-torch benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: benchmark / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            workers: ""
            dist: ""
          - variant: xdist-2
            workers: "2"
            dist: loadscope
          - variant: xdist-4
            workers: "4"
            dist: loadscope
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Cache python modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pkg-deps-3.11-${{ hashFiles('pyproject.toml') }}-tests

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[viz,html] --upgrade
          pip install -e .[testing]
          if [ -n "${{ matrix.workers }}" ]; then
            pip install pytest-cov pytest-xdist
          fi

      - name: Run pytest-torch benchmark
        shell: bash
        run: |
          set -o pipefail
          started_at="$(date +%s)"
          if [ -n "${{ matrix.workers }}" ]; then
            cmd=(
              pytest
              tests/pytorch/
              -rs
              --durations=20
              -n "${{ matrix.workers }}"
              --dist "${{ matrix.dist }}"
              --cov=doctr
              --cov-report=xml:coverage-pt.xml
            )
          else
            cmd=(coverage run -m pytest tests/pytorch/ -rs --durations=20)
          fi

          printf 'variant=%s\n' "${{ matrix.variant }}" | tee benchmark-result.txt
          printf 'command=%q ' "${cmd[@]}" | tee -a benchmark-result.txt
          printf '\n' | tee -a benchmark-result.txt

          set +e
          "${cmd[@]}" 2>&1 | tee pytest.log
          status="${PIPESTATUS[0]}"
          set -e

          ended_at="$(date +%s)"
          duration_s="$((ended_at - started_at))"
          printf 'status=%s\n' "$status" | tee -a benchmark-result.txt
          printf 'duration_s=%s\n' "$duration_s" | tee -a benchmark-result.txt

          if [ -z "${{ matrix.workers }}" ]; then
            coverage xml -o coverage-pt.xml
          fi
          test -s coverage-pt.xml
          exit "$status"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-torch-benchmark-${{ matrix.variant }}
          path: |
            benchmark-result.txt
            pytest.log
            coverage-pt.xml
          if-no-files-found: warn

  summarize:
    name: summarize benchmark
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pytest-torch-benchmark-*
          path: benchmark-artifacts
          merge-multiple: false

      - name: Summarize
        shell: bash
        run: |
          find benchmark-artifacts -name benchmark-result.txt -print -exec cat {} \;
